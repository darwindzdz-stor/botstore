<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Bot Store — لوحة التحكم</title><link rel="stylesheet" href="/css/app.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><div class="admin-shell"><header class="admin-head"><div><span class="eyebrow">BOT STORE CONTROL CENTER</span><h1>لوحة التحكم</h1><p>إدارة البوتات والمراجعات والتقارير والبيانات من مكان واحد.</p></div><button class="icon-btn" id="adminRefresh">↻</button></header><section id="adminStats" class="stats-grid"></section><section class="admin-toolbar"><input id="botFilter" placeholder="ابحث بالاسم أو username"><select id="statusFilter"><option value="">كل الحالات</option><option>APPROVED</option><option>PENDING</option><option>SUSPENDED</option><option>ARCHIVED</option></select><button class="primary" id="addBot">＋ إضافة بوت</button><button id="backupBtn">💾 نسخة احتياطية</button></section><section class="admin-grid"><div class="panel"><div class="section-title"><h2>البوتات</h2><span id="botCount"></span></div><div id="botTable" class="table-wrap"></div></div><div class="panel"><div class="section-title"><h2>طلبات الإضافة</h2></div><div id="submissionList"></div></div><div class="panel"><div class="section-title"><h2>التقارير</h2></div><div id="reportList"></div></div><div class="panel"><div class="section-title"><h2>الإعلانات</h2><button id="addAd">＋ إعلان</button></div><div id="adList"></div></div><div class="panel"><div class="section-title"><h2>سجل التدقيق</h2></div><div id="auditList"></div></div></section></div><div id="modal" class="modal hidden"><div class="sheet"><button id="closeModal" class="close">×</button><div id="modalContent"></div></div></div><div id="toast" class="toast"></div><script src="/js/admin.js"></script></body></html>
